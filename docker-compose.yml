services:
  pricewatcher:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data  # holds pricewatcher.db; copy your existing DB here before the first start
    env_file:
      - path: .env  # TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID; alerts are off without it
        required: false
    shm_size: "1gb"  # Chromium crashes with Docker's default 64 MB /dev/shm
    restart: unless-stopped
