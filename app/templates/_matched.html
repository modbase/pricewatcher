<section class="rounded-xl border border-slate-200 bg-white p-4 dark:border-slate-800 dark:bg-slate-900">
  <div class="flex items-center justify-between gap-2">
    <h2 class="font-medium">{{ shop }}</h2>
    <button hx-get="/products/{{ product_id }}/match/{{ shop }}" hx-target="closest section" hx-swap="outerHTML"
            class="text-sm text-slate-500 hover:underline">Search again</button>
  </div>
  {% if title %}
  <p class="mt-2 text-sm">
    Matched <a href="{{ url }}" target="_blank" rel="noopener noreferrer" class="hover:underline">{{ title }}</a>
    <span class="text-slate-500">(checking the price in the background)</span>
  </p>
  {% endif %}
  {% if error %}
  <p class="mt-2 text-sm text-red-600 dark:text-red-400">{{ error }}</p>
  {% include "_paste.html" %}
  {% endif %}
</section>
